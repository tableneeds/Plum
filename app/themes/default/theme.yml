name: Default
handle: default
version: 0.1.0
author: Plum
category: Starter
screenshot: screenshot.svg
description: Clean starter theme for simple Plum sites.
settings:
  fields:
    - handle: accent_color
      type: color
      label: Accent Color
      default: "#7c3aed"
      help: Used for links and small accents.
    - handle: show_powered_by
      type: boolean
      label: Show Powered By
      default: true
blocks:
  - handle: hero
    label: Hero
    fields:
      - handle: heading
        type: text
        label: Heading
      - handle: subheading
        type: textarea
        label: Subheading
      - handle: image
        type: image
        label: Background Image
  - handle: rich_text
    label: Rich Text
    fields:
      - handle: body
        type: rich_text
        label: Body
