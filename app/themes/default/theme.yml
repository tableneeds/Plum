name: Default
handle: default
version: 0.1.0
author: Plum
category: Starter
screenshot: screenshot.svg
description: Clean starter theme for simple Plum sites.
settings:
  fields:
    - handle: accent_color
      type: color
      label: Accent Color
      default: "#7c3aed"
      help: Used for links and small accents.
    - handle: show_powered_by
      type: boolean
      label: Show Powered By
      default: true
blocks:
  - handle: hero
    label: Hero
    fields:
      - handle: heading
        type: text
        label: Heading
      - handle: subheading
        type: textarea
        label: Subheading
      - handle: image
        type: image
        label: Background Image
  - handle: rich_text
    label: Rich Text
    fields:
      - handle: body
        type: rich_text
        label: Body
  - handle: image_text
    label: Image + Text
    fields:
      - handle: heading
        type: text
        label: Heading
      - handle: body
        type: rich_text
        label: Body
      - handle: image
        type: image
        label: Image
      - handle: image_position
        type: select
        label: Image Position
        options:
          - label: Left
            value: left
          - label: Right
            value: right
  - handle: cta
    label: Call to Action
    fields:
      - handle: heading
        type: text
        label: Heading
      - handle: text
        type: textarea
        label: Text
      - handle: button_label
        type: text
        label: Button Label
      - handle: button_url
        type: text
        label: Button URL
  - handle: gallery
    label: Gallery
    fields:
      - handle: heading
        type: text
        label: Heading
      - handle: image_one
        type: image
        label: Image One
      - handle: image_two
        type: image
        label: Image Two
      - handle: image_three
        type: image
        label: Image Three
